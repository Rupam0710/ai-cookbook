[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hybrid-retrieval"
version = "0.1.0"
description = "Hybrid retrieval (BM25 + dense + RRF + reranker) tutorial on the FiQA-2018 benchmark."
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.2.13",
    "cohere>=5.13.6",
    "datasets>=3.2.0",
    "numpy>=2.1.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.13.0",
    "tqdm>=4.67.1",
]

[tool.setuptools]
packages = []
